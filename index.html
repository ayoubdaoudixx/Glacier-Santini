<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Glacier Santini — Menu</title>
  <link rel="icon" type="image/png" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3EAD9; --ink:#13202B; --line:#13202B33; --card:#EDE2CC;
  --tomato:#D8402B; --pista:#5E8C3A; --honey:#C9861A; --cocoa:#6B3F26;
  --accent:var(--tomato); --on-accent:#F3EAD9;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F1A24; --ink:#EFE6D2; --line:#EFE6D233; --card:#16253300;
    --tomato:#FF6A52; --pista:#9CCB6B; --honey:#F0B24A; --cocoa:#D29A74; --on-accent:#0F1A24;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1A24; --ink:#EFE6D2; --line:#EFE6D233; --card:#16253300;
  --tomato:#FF6A52; --pista:#9CCB6B; --honey:#F0B24A; --cocoa:#D29A74; --on-accent:#0F1A24;
}
body[data-cat="1"]{--accent:var(--pista)}
body[data-cat="2"]{--accent:var(--honey)}
body[data-cat="3"]{--accent:var(--cocoa)}
*{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Space Mono',ui-monospace,Menlo,monospace;font-size:14px;line-height:1.5;
  background-image:radial-gradient(var(--line) .6px,transparent .7px);background-size:5px 5px;transition:background-color .4s}
.wrap{max-width:640px;margin:0 auto;padding:0 18px 230px}
h1,h2,.serif{font-family:'Fraunces',Georgia,serif;letter-spacing:-.025em;margin:0}

.lang{display:flex;justify-content:flex-end;gap:0;padding:12px 0 0}
.lang button{font:700 12px 'Space Mono',monospace;padding:4px 12px;border:2px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}
.lang button:first-child{border-radius:99px 0 0 99px;border-right-width:1px}
.lang button:last-child{border-radius:0 99px 99px 0;border-left-width:1px}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.lang button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.bg{position:absolute;inset:0;z-index:-1;overflow:hidden;pointer-events:none}

E%3Cg transform=%22translate%28272 30%29 rotate%2812 50 50%29 scale%281.2%29%22%3E%3Ccircle cx=%2250%22 cy=%2221%22 r=%225%22/%3E%3Cpath d=%22M28 50a22 22 0 1 1 44 0q4 8-4 9q-4 5-9 1q-5 5-9 0q-4 5-9 0q-5 4-9-1q-8-1-4-9z%22/%3E%3Cpath d=%22M33 61L50 97L67 61%22/%3E%3Cpath d=%22M36.4 68.2L57.7 80.8M63.6 68.2L42.3 80.8M41.5 79L53.4 89.8M58.5 79L46.6 89.8%22/%3E%3C/g%3E%3Cg transform=%22translate%2814 230%29 rotate%28-14 50 50%29 scale%281.05%29%22%3E%3Cpath d=%22M50 94C22 72 16 42 33 35C41 32 46 36 50 36C54 36 59 32 67 35C84 42 78 72 50 94z%22/%3E%3Cpath d=%22M50 36L38 22M50 36V16M50 36L62 22%22/%3E%3Cpath d=%22M38 52v4M50 58v4M62 52v4M43 70v4M57 70v4%22/%3E%3C/g%3E%3Cg transform=%22translate%28276 430%29 rotate%288 50 50%29 scale%281.15%29%22%3E%3Ccircle cx=%2252%22 cy=%2219%22 r=%225%22/%3E%3Cpath d=%22M26 46a24 22 0 0 1 48 0%22/%3E%3Cpath d=%22M18 46H82Q82 72 50 74Q18 72 18 46z%22/%3E%3Cpath d=%22M50 74V90M34 92H66%22/%3E%3C/g%3E%3Cg transform=%22translate%2820 610%29 rotate%2816 50 50%29 scale%281.1%29%22%3E%3Crect x=%2231%22 y=%226%22 width=%2238%22 height=%2262%22 rx=%2219%22/%3E%3Cpath d=%22M44 68V94H56V68%22/%3E%3Cpath d=%22M31 30H69M40 16v8%22/%3E%3C/g%3E%3Cg transform=%22translate%28280 730%29 rotate%28-12 50 50%29 scale%281.0%29%22%3E%3Ccircle cx=%2232%22 cy=%2274%22 r=%2215%22/%3E%3Ccircle cx=%2268%22 cy=%2278%22 r=%2215%22/%3E%3Cpath d=%22M33 59Q38 30 62 12M68 63Q66 36 62 12%22/%3E%3Cpath d=%22M62 12q14-4 24 6q-16 6-24-6z%22/%3E%3C/g%3E%3C/svg%3E");-webkit-mask-size:min(100vw,520px) auto;mask-size:min(100vw,520px) auto;-webkit-mask-repeat:repeat;mask-repeat:repeat;-webkit-mask-position:50% 0;mask-position:50% 0}
.wm{position:absolute;left:-2vw;right:-2vw;text-align:center;white-space:nowrap;font:800 min(24vw,170px)/1 'Fraunces',Georgia,serif;letter-spacing:-.04em;color:var(--tomato);opacity:.04}
.wm.top{top:-.4em}.wm.bot{bottom:-.4em}
.corner{position:absolute;bottom:22px;width:min(48vw,230px);height:auto;fill:none;stroke:var(--tomato);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;opacity:.15}
.corner.l{left:-11vw;transform:rotate(-14deg)}.corner.r{right:-9vw;transform:rotate(12deg)}
html{-webkit-text-size-adjust:100%}
body{position:relative;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
@media (max-width:380px){.strip{grid-template-columns:44px 54px 1fr}.num{font-size:28px}.ico{width:54px;height:54px}.row .nm,.fl b{font-size:17px}h2{font-size:26px}.hero{grid-template-columns:1fr 78px}.cone{width:78px}}
/* hero */
.hero{padding:26px 0 18px;display:grid;grid-template-columns:1fr 96px;gap:10px;align-items:end;border-bottom:3px solid var(--ink)}
.hero h1{font-size:clamp(46px,14vw,84px);line-height:.88;font-weight:800}
.hero p{margin:10px 0 0;max-width:30ch}
.cone{width:96px;height:130px;overflow:visible}
.cone.pop{animation:lid .45s cubic-bezier(.2,.8,.2,1);transform-origin:50% 100%}
.cone .a{fill:var(--accent);transition:fill .4s}
.cone .b{fill:var(--ink);mix-blend-mode:multiply;opacity:.85}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .cone .b{mix-blend-mode:screen;opacity:.5}}

/* tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:4px;padding:10px 0 0;background:var(--paper);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;font:700 13px 'Space Mono',monospace;padding:10px 14px 9px;border:2px solid var(--ink);border-bottom:0;border-radius:14px 14px 0 0;background:transparent;color:var(--ink);cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.tab:focus-visible,.chip:focus-visible,.chip:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.rail{height:6px;background:var(--accent);transition:background .4s;margin-bottom:16px}

.tools{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:8px}
.chip{font:400 12px 'Space Mono',monospace;border:2px solid var(--ink);background:transparent;color:var(--ink);padding:4px 10px;border-radius:99px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

h2{font-size:30px;font-weight:600;margin:20px 0 4px}
.sub{margin:0 0 10px;opacity:.75}

/* flavour strips */
.strip{display:grid;grid-template-columns:56px 64px 1fr;align-items:center;gap:6px;padding:10px 0;border-top:1.5px dashed var(--line)}
.num{font:800 36px/1 'Fraunces',serif;letter-spacing:-.04em;color:var(--accent);transition:color .4s}
.strip:nth-child(even){padding-left:14px}
.strip:nth-child(even) .num{transform:rotate(-4deg)}
.ico{width:64px;height:64px;object-fit:contain;justify-self:center;transform:rotate(3deg)}
.strip:nth-child(even) .ico{transform:rotate(-3deg)}
.fl b{font:600 19px 'Fraunces',serif;letter-spacing:-.01em;display:block}
.fl span{opacity:.78;font-size:13px}

/* items */
.row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:12px 0;border-top:1.5px dashed var(--line)}
.row .nm{font:600 19px 'Fraunces',serif;letter-spacing:-.01em;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row .ds{grid-column:1;opacity:.75;font-size:13px}
.pr{grid-column:2;grid-row:1/3;align-self:center;justify-self:end;font-weight:700;font-size:16px;white-space:nowrap}
.stamp{font:700 10px 'Space Mono',monospace;border:2px solid var(--accent);color:var(--accent);padding:0 6px;border-radius:4px;transform:rotate(-5deg);display:inline-block;transition:color .4s,border-color .4s}
.row[hidden]{display:none}

/* panel swap */
.panel{animation:lid .38s cubic-bezier(.2,.8,.2,1);transform-origin:top}
@keyframes lid{from{opacity:0;transform:perspective(600px) rotateX(-14deg) translateY(-8px)}to{opacity:1;transform:none}}

.foot{margin-top:28px;border-top:3px solid var(--ink);padding-top:12px;font-size:12px;opacity:.8}
@media (prefers-reduced-motion:reduce){.panel{animation:none}.cone.pop{animation:none}*{transition:none!important}}
</style>
</head>

function stamps(o){o=o||{};return (o.v?'<span class="stamp">'+tr('Vegan')+'</span>':'')+(o.n?'<span class="stamp">'+tr('New')+'</span>':'')}

const HERO_D=["", "<path d=\"M8 54H88\" stroke=\"var(--paper)\" stroke-width=\"3\" fill=\"none\"/><circle cx=\"48\" cy=\"7\" r=\"2\" fill=\"var(--paper)\" stroke=\"none\"/>", "<path d=\"M18 46H78\" stroke=\"var(--paper)\" stroke-width=\"3\" fill=\"none\"/><path d=\"M34 64L36 108M48 64V108M62 64L60 108\" stroke=\"var(--paper)\" stroke-width=\"3\" stroke-linecap=\"round\" fill=\"none\"/>", "<path d=\"M6 61H90M6 85H90\" stroke=\"var(--paper)\" stroke-width=\"3\" fill=\"none\"/><circle cx=\"24\" cy=\"49\" r=\"2.5\" fill=\"var(--paper)\"/><circle cx=\"48\" cy=\"49\" r=\"2.5\" fill=\"var(--paper)\"/><circle cx=\"72\" cy=\"49\" r=\"2.5\" fill=\"var(--paper)\"/><circle cx=\"24\" cy=\"98\" r=\"2.5\" fill=\"var(--paper)\"/><circle cx=\"48\" cy=\"98\" r=\"2.5\" fill=\"var(--paper)\"/><circle cx=\"72\" cy=\"98\" r=\"2.5\" fill=\"var(--paper)\"/>"];
let heroCat=-1;
function setHero(){
  if(heroCat===cat)return; heroCat=cat;
  const s=document.querySelector('.cone');
  s.querySelector('.b').innerHTML=HERO[cat];
  s.querySelector('.a').innerHTML=HERO[cat]+HERO_D[cat];
  s.classList.remove('pop'); void s.getBoundingClientRect(); s.classList.add('pop');
}
function render(){
  document.body.dataset.cat=cat;
  setHero();
  [...$('#tabs').children].forEach((t,i)=>t.setAttribute('aria-selected',i===cat));
  const c=CATS[cat];
  let h='';
  if(cat===0){
    h+='<h2>'+tr('Nine flavours today')+'</h2><p class="sub">'+tr('Pick them at the counter. They all cost the same.')+'</p><div>';
    FLAVOURS.forEach((f,i)=>{ if(vegan&&!(f[2]&&f[2].v))return;
      h+=`<div class="strip"><div class="num">${String(i+1).padStart(2,'0')}</div><img class="ico" src="${ICONS[i]}" alt="" width="64" height="64"><div class="fl"><b>${tr(f[0])} ${stamps(f[2])}</b><span>${tr(f[1])}</span></div></div>`});
    h+='</div>';
  }
  h+=`<h2>${tr(c.n)}</h2><p class="sub">${tr(c.s)}</p><div>`;
  let shown=0;
  c.items.forEach((it,i)=>{
    const o=it[3]||{}; if(vegan&&!o.v)return; shown++;
    h+=`<div class="row"><div class="nm">${tr(it[0])} ${stamps(o)}</div>
    <span class="pr">${eur(it[1])}</span>
    <div class="ds">${tr(it[2])}</div></div>`;
  });
  if(!shown)h+='<p class="empty">'+tr('No vegan items in this category. Try Scoops, Sundaes or Shakes.')+'</p>';
  h+='</div>';
  const p=$('#panel'); p.innerHTML=h;
  p.style.animation='none'; void p.offsetWidth; p.style.animation='';
  $('#count').textContent=shown+' '+tr(shown===1?'item':'items');
}

function buildTabs(){$('#tabs').innerHTML=CATS.map((c,i)=>`<button class="tab" role="tab" data-c="${i}" aria-selected="false">${tr(c.n)}</button>`).join('')}
function setLang(l){lang=l;try{localStorage.setItem('lang',l)}catch(e){}
  document.documentElement.lang=l;
  document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===l));
  document.querySelectorAll('[data-t]').forEach(el=>{if(!el.dataset.en)el.dataset.en=el.textContent;el.textContent=tr(el.dataset.en)});
  $('#tabs').setAttribute('aria-label',tr('Menu categories'));
  buildTabs();render()}
document.querySelector('.lang').onclick=e=>{const b=e.target.closest('button[data-l]');if(b&&b.dataset.l!==lang)setLang(b.dataset.l)};
$('#tabs').onclick=e=>{const b=e.target.closest('.tab'); if(!b)return; cat=+b.dataset.c; render()};
$('#vegan').onclick=e=>{vegan=!vegan; e.currentTarget.setAttribute('aria-pressed',vegan); render()};
setLang(lang);
</script>
</body>
</html>
